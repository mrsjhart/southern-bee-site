<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shop | Southern Bee Collective</title>
  <meta name="description" content="Digital downloads and boutique goods from Southern Bee Collective.">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Work+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="" onerror="this.remove()">
        <span class="brand-name">Southern Bee Collective</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="shop.html" aria-current="page">Shop</a>
        <a href="subscribe.html">Join the list</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero page-hero">
      <div class="wrap">
        <h1>Shop</h1>
        <p>Every download is delivered to your inbox the moment you check out.</p>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="section-head">
          <span class="eyebrow">Digital downloads</span>
          <h2>Books, guides, templates and printables</h2>
        </div>
        <div class="filters" id="filters" role="group" aria-label="Filter by type"></div>
        <div class="grid" id="downloads-grid"></div>
      </div>
    </section>

    <section class="section" style="background:var(--comb)">
      <div class="wrap">
        <div class="section-head">
          <span class="eyebrow">Boutique</span>
          <h2>Boutique goods</h2>
        </div>
        <div id="boutique-grid"></div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; <span id="year">2026</span> Southern Bee Collective</span>
      <span><a href="subscribe.html">Join the list</a> &middot; <a href="shop.html">Shop</a></span>
    </div>
  </footer>
</body>
</html>
