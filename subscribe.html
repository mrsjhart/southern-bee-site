<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Join the list | Southern Bee Collective</title>
  <meta name="description" content="Join the Southern Bee Collective email list.">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Work+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="" onerror="this.remove()">
        <span class="brand-name">Southern Bee Collective</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="subscribe.html" aria-current="page">Join the list</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="signup light" id="signup">
      <div class="wrap">
        <div class="section-head">
          <span class="eyebrow">The Hive Letter</span>
          <h2>Join the Hive Letter</h2>
          <p>Be the first to know about new downloads, freebies and boutique drops. One or two emails a month, and you can unsubscribe anytime.</p>
        </div>
        <form class="signup-form" id="signup-form-page" novalidate>
          <div class="row">
            <input id="name-page" name="name" type="text" aria-label="First name" placeholder="First name" autocomplete="given-name">
            <input id="email-page" name="email" type="email" aria-label="Email address" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="row"><button class="btn" type="submit">Sign me up</button></div>
          <p class="form-note" role="status"></p>
        </form>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; <span id="year">2026</span> Southern Bee Collective</span>
      <span><a href="subscribe.html">Join the list</a> &middot; <a href="shop.html">Shop</a></span>
    </div>
  </footer>
</body>
</html>
